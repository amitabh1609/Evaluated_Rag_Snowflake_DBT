services:
  - type: web
    name: erag-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QDRANT_URL
        value: https://f91ef826-3037-4a73-9cc9-2a8d73365366.us-west-1-0.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: GENERATOR_MODEL
        value: claude-sonnet-4-6
      - key: REWRITER_MODEL
        value: claude-haiku-4-5-20251001
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-large
      - key: QDRANT_COLLECTION
        value: erag_docs
      - key: LANGFUSE_HOST
        value: ""
      - key: LANGFUSE_PUBLIC_KEY
        value: ""
      - key: LANGFUSE_SECRET_KEY
        value: ""
